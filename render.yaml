databases:
  # NOTE: the free plan is deleted by Render after its trial window. For a
  # programme measured in months, move this to a paid plan in the dashboard
  # once you have confirmed the setup works. Keep JSON exports either way.
  - name: ledger-db
    plan: free
    databaseName: ledger
    user: ledger

services:
  - type: web
    name: 26-10-27
    runtime: node
    plan: free
    # build.js regenerates public/index.html from src/app.html on every push.
    buildCommand: npm install && node build.js
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      # Render generates this and shows it in the dashboard. It is never
      # committed, and never passes through the conversation that built this.
      - key: LEDGER_KEY
        generateValue: true
      - key: NODE_VERSION
        value: "22"
